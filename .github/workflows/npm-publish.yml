name: Publish Package

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup & run pnpm
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: publish
        run: pnpm publish --tag latest
