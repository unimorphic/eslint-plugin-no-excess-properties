name: Pull Request

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install dependencies
        run: npm install

      - name: run prettier
        run: npm run format-check

      - name: run lint
        run: npm run lint

      - name: run tests
        run: npm run test
