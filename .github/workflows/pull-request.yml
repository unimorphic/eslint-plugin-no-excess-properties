name: Pull Request

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup & run pnpm
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: run prettier
        run: pnpm run format-check

      - name: run lint
        run: pnpm run lint

      - name: run tests
        run: pnpm run test
